[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sno2md"
version = "0.2.0"
description = "Decode Samsung Notes SDOCX and export PDF and Markdown"
requires-python = ">=3.9"
dependencies = ["pypdf==6.20.1"]
license-files = ["third_party/pypdf-LICENSE.txt", "third_party/fonttools-LICENSE.txt", "third_party/fonttools-LICENSE.external.txt"]

[project.optional-dependencies]
markdown = ["fonttools==4.66.1"]
desktop = ["fonttools==4.66.1", "pywin32==312; sys_platform == 'win32'"]

[project.scripts]
sno2md = "sno2md.cli:main"

[project.gui-scripts]
sno2md-gui = "sno2md.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sno2md*"]
